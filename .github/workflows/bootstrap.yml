name: Bootstrap Qadi Araak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project files
        shell: bash
        run: |
          cat .bootstrap-small/part* | tr -d '\n' | base64 --decode > /tmp/qadiaraak.tar.gz
          tar -xzf /tmp/qadiaraak.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap .bootstrap-small .github/workflows/bootstrap.yml

      - name: Install and validate
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm run build

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Qadi Araak application"
          git push
