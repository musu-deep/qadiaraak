<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">خلفية سينمائية قانونية لمنصة محامي اراك</title>
  <desc id="desc">مكتب قانوني تنفيذي داكن بإضاءة ذهبية، مكتبة قانونية، أفق مدينة، مكتب وميزان عدالة دون أشخاص أو نصوص.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060c15"/>
      <stop offset="0.45" stop-color="#0a1627"/>
      <stop offset="1" stop-color="#08111e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1814"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="0.55" stop-color="#172132"/>
      <stop offset="1" stop-color="#090f19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d58b"/>
      <stop offset="0.5" stop-color="#c99a3d"/>
      <stop offset="1" stop-color="#7d5317"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20324a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0.74"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.2" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#e2a94d" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#b77621" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cityGlow" cx="0.78" cy="0.45" r="0.42">
      <stop offset="0" stop-color="#4d7aa8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur34"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>
  <rect width="1920" height="1080" fill="url(#cityGlow)"/>

  <!-- left architectural wall -->
  <path d="M0 0h525v1080H0z" fill="url(#wood)"/>
  <path d="M0 0h480l120 1080H0z" fill="#0b0c10" opacity="0.34"/>
  <path d="M32 54h430v12H32z" fill="#d49a3c" opacity="0.62" filter="url(#blur18)"/>
  <path d="M0 105h490" stroke="#d29a44" stroke-width="5" opacity="0.6"/>

  <!-- law shelves -->
  <g opacity="0.92" filter="url(#shadow)">
    <rect x="58" y="238" width="382" height="566" rx="10" fill="#0d1118" stroke="#9f722e" stroke-opacity="0.22"/>
    <rect x="78" y="268" width="342" height="154" fill="#111822"/>
    <rect x="78" y="450" width="342" height="154" fill="#111822"/>
    <rect x="78" y="632" width="342" height="142" fill="#111822"/>
    <path d="M78 422h342M78 604h342" stroke="#bd8738" stroke-opacity="0.38"/>
    <path d="M78 288h342M78 470h342M78 652h342" stroke="#e4aa52" stroke-opacity="0.18"/>
  </g>

  <!-- books -->
  <g opacity="0.8">
    <g transform="translate(94 318)">
      <rect width="32" height="88" rx="3" fill="#26344a"/><rect x="38" width="25" height="88" rx="3" fill="#5b3a24"/><rect x="69" width="29" height="88" rx="3" fill="#2c405c"/><rect x="104" width="31" height="88" rx="3" fill="#403124"/><rect x="141" width="25" height="88" rx="3" fill="#2d3c51"/><rect x="172" width="34" height="88" rx="3" fill="#55351f"/><rect x="212" width="29" height="88" rx="3" fill="#26374e"/><rect x="247" width="30" height="88" rx="3" fill="#4f3828"/>
      <g stroke="#d7ad64" stroke-opacity="0.48"><path d="M8 18h16M8 65h16M44 14h13M44 67h13M77 17h13M77 65h13M112 16h15M112 67h15M148 15h11M148 66h11M180 17h17M180 64h17M219 14h14M219 67h14M254 17h16M254 65h16"/></g>
    </g>
    <g transform="translate(100 501)">
      <rect width="28" height="84" rx="3" fill="#4b3325"/><rect x="34" width="34" height="84" rx="3" fill="#253a54"/><rect x="74" width="28" height="84" rx="3" fill="#5a3b27"/><rect x="108" width="32" height="84" rx="3" fill="#2e415b"/><rect x="146" width="28" height="84" rx="3" fill="#503522"/><rect x="180" width="36" height="84" rx="3" fill="#2b3e56"/><rect x="222" width="31" height="84" rx="3" fill="#593a24"/>
      <g stroke="#d7ad64" stroke-opacity="0.42"><path d="M7 16h14M7 63h14M42 15h17M42 64h17M82 17h13M82 63h13M116 15h16M116 65h16M153 16h14M153 64h14M189 15h18M189 65h18M230 16h14M230 64h14"/></g>
    </g>
    <g transform="translate(92 684)">
      <rect width="34" height="72" rx="3" fill="#26384e"/><rect x="40" width="29" height="72" rx="3" fill="#523725"/><rect x="75" width="35" height="72" rx="3" fill="#2b3f58"/><rect x="116" width="30" height="72" rx="3" fill="#4f3523"/><rect x="152" width="34" height="72" rx="3" fill="#263a52"/><rect x="192" width="31" height="72" rx="3" fill="#593a26"/><rect x="229" width="33" height="72" rx="3" fill="#2f4258"/>
    </g>
  </g>

  <!-- shield emblem -->
  <g transform="translate(180 105)" filter="url(#shadow)">
    <path d="M75 0l72 29v72c0 74-45 118-72 132-27-14-72-58-72-132V29L75 0z" fill="#101824" stroke="url(#gold)" stroke-width="4"/>
    <path d="M75 48v112M38 75h74" stroke="#d4a24d" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M39 75l-20 40h40L39 75zm72 0l-20 40h40l-20-40z" fill="none" stroke="#d4a24d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M55 166h40M45 181h60" stroke="#d4a24d" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- glass wall and city -->
  <rect x="510" y="0" width="1410" height="835" fill="url(#glass)"/>
  <path d="M510 0h1410v830H510z" fill="#06101c" opacity="0.18"/>
  <g opacity="0.75">
    <path d="M596 0v835M806 0v835M1016 0v835M1226 0v835M1436 0v835M1646 0v835M1856 0v835" stroke="#a5bdd4" stroke-opacity="0.08" stroke-width="3"/>
    <path d="M510 188h1410M510 418h1410M510 648h1410" stroke="#a5bdd4" stroke-opacity="0.05" stroke-width="3"/>
  </g>

  <g opacity="0.78">
    <path d="M1245 695V392h80v303z" fill="#14243a"/><path d="M1338 695V324h96v371z" fill="#102037"/><path d="M1448 695V438h68v257z" fill="#172940"/><path d="M1528 695V278h112v417z" fill="#0f2037"/><path d="M1654 695V370h82v325z" fill="#14273f"/><path d="M1748 695V232h102v463z" fill="#0f2138"/>
    <g fill="#d9b36a" opacity="0.48">
      <rect x="1260" y="420" width="10" height="7"/><rect x="1282" y="445" width="10" height="7"/><rect x="1304" y="480" width="10" height="7"/>
      <rect x="1358" y="350" width="11" height="8"/><rect x="1385" y="392" width="11" height="8"/><rect x="1410" y="455" width="11" height="8"/>
      <rect x="1549" y="310" width="12" height="8"/><rect x="1580" y="363" width="12" height="8"/><rect x="1612" y="433" width="12" height="8"/>
      <rect x="1768" y="271" width="12" height="8"/><rect x="1798" y="322" width="12" height="8"/><rect x="1824" y="401" width="12" height="8"/>
    </g>
  </g>

  <!-- ceiling strips -->
  <path d="M450 45h1450" stroke="#d8a14d" stroke-width="4" opacity="0.42" filter="url(#blur18)"/>
  <path d="M610 78h1180" stroke="#f3c878" stroke-width="2" opacity="0.32"/>
  <g fill="#f6d28a" opacity="0.75" filter="url(#blur18)">
    <circle cx="650" cy="86" r="20"/><circle cx="920" cy="86" r="18"/><circle cx="1190" cy="86" r="18"/><circle cx="1460" cy="86" r="18"/>
  </g>

  <!-- desk foreground -->
  <path d="M0 820C420 760 870 770 1920 790v290H0z" fill="url(#desk)"/>
  <path d="M0 830C540 790 1100 780 1920 805" stroke="#c08a37" stroke-opacity="0.22" stroke-width="3"/>
  <ellipse cx="1500" cy="930" rx="420" ry="75" fill="#000" opacity="0.42" filter="url(#blur34)"/>

  <!-- books on desk -->
  <g transform="translate(1450 820) rotate(-3)" filter="url(#shadow)">
    <rect x="0" y="70" width="300" height="56" rx="7" fill="#10141b" stroke="#b88434" stroke-opacity="0.42"/>
    <rect x="25" y="18" width="260" height="58" rx="7" fill="#171b22" stroke="#c08a37" stroke-opacity="0.48"/>
    <path d="M28 39h254M8 94h286" stroke="#d3a14f" stroke-opacity="0.35"/>
  </g>

  <!-- justice scale -->
  <g transform="translate(1610 565)" filter="url(#shadow)">
    <path d="M0 305h210" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M105 0v295" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M28 68h154" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M30 68l-18 112M180 68l18 112" stroke="#d8a44f" stroke-width="4"/>
    <path d="M0 180h52c-5 28-18 44-26 44S5 208 0 180zm158 0h52c-5 28-18 44-26 44s-21-16-26-44z" fill="none" stroke="#d8a44f" stroke-width="5"/>
    <circle cx="105" cy="20" r="18" fill="url(#gold)"/>
    <path d="M78 294h54" stroke="#d8a44f" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- document and pen -->
  <g transform="translate(1130 850) rotate(-5)" opacity="0.72">
    <rect width="290" height="150" rx="14" fill="#d8dde3" fill-opacity="0.12" stroke="#e5e7eb" stroke-opacity="0.12"/>
    <path d="M34 38h210M34 70h164M34 102h194" stroke="#d8dde3" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(1375 925) rotate(18)" filter="url(#shadow)">
    <rect width="190" height="12" rx="6" fill="url(#gold)"/><path d="M190 0l24 6-24 6z" fill="#d7b46e"/>
  </g>

  <!-- cinematic overlays -->
  <rect width="1920" height="1080" fill="url(#warm)" opacity="0.4"/>
  <path d="M0 0h1920v1080H0z" fill="none" stroke="#09111c" stroke-width="72" opacity="0.7"/>
  <rect width="1920" height="1080" fill="#02070d" opacity="0.16"/>
</svg>
